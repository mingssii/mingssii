name: Ecosystem Ops & Portfolio Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 09:00 ICT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run GitHub Ecosystem Ops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-ops.mjs

      - name: Commit changes if portfolio or health changed
        run: |
          if git diff --quiet README.md status/ecosystem-health.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md status/ecosystem-health.json
          git commit -m "chore(ops): sync portfolio catalog and ecosystem health"
          git push
